{% extends "base.html" %}
{% block title %}{{ post.title }} — Ben Luedtke{% endblock %}

{% block content %}
<div class="post-header">
    <p class="post-meta-date">{{ post.date }}</p>
    <h1>{{ post.title }}</h1>
    {% if post.description %}
    <p class="subtitle">{{ post.description }}</p>
    {% endif %}
</div>

<div class="post-content">
    {{ post.content | safe }}
</div>

<div class="post-footer">
    <a href="/blog" class="back-to-blog">← all posts</a>
</div>
{% endblock %}
